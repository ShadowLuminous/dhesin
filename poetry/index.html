<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poetry • Dhesin Moodley</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="../favicon2.ico" type="image/x-icon" sizes="16x16" />
</head>
<body>
    <header>
        <h1>Soft Spoken Poetry</h1>
        <div class="filter-controls">

    </footer>
